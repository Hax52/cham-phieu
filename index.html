<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chấm Phiếu THPT</title>
<meta name="description" content="Chấm phiếu trắc nghiệm THPT 2025 bằng camera điện thoại.">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1B1E22" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chấm Phiếu">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: brand bar + two numbered steps (answer keys → grading). The key editor mirrors the
   sheet's own bubble grid; graded sheets sit in a ledger table; review opens full-height on top. */
:root{
  color-scheme:light;
  --bg:#F4F3F1; --surface:#FFFFFF; --sunken:#EEECE9; --ink:#1D2024; --muted:#5D636B; --line:#DFDBD7;
  --accent:#C4283C; --accent-ink:#FFFFFF; --accent-soft:#FBE6E9;
  --form:#E58A8A; --form-soft:#FDF2F2;
  --pencil:#33383E; --on-pencil:#FFFFFF;
  --ok:#1C7F52; --ok-soft:#E1F2E8; --warn:#9F5E00; --warn-soft:#FAEED6; --bad:#C4283C; --bad-soft:#FBE6E9;
  --shadow:0 1px 2px rgb(30 32 36 / .06), 0 10px 30px rgb(30 32 36 / .10);
  --f-display:"Bricolage Grotesque","Be Vietnam Pro",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:12px; --r-s:8px;
  /* marks drawn over a photo of paper keep one value in both themes */
  --m-ok:#11935A; --m-bad:#E0263F; --m-info:#2D63C8; --m-warn:#F29A00; --m-form:#EE8F8F; --m-pencil:#2B2F34; --m-paper:#FFFFFF; --m-text:#9A4A4A;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131518; --surface:#1B1E22; --sunken:#23272C; --ink:#E8EAED; --muted:#9AA1AA; --line:#30353B;
    --accent:#FF6476; --accent-ink:#1C0B0E; --accent-soft:#3A1D23; --form:#C26871; --form-soft:#2A1F21;
    --pencil:#DADDE1; --on-pencil:#15171A;
    --ok:#4FC48D; --ok-soft:#163020; --warn:#F2AA45; --warn-soft:#372913; --bad:#FF6476; --bad-soft:#3A1D23;
    --shadow:0 1px 2px rgb(0 0 0 / .4), 0 10px 30px rgb(0 0 0 / .35); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131518; --surface:#1B1E22; --sunken:#23272C; --ink:#E8EAED; --muted:#9AA1AA; --line:#30353B;
  --accent:#FF6476; --accent-ink:#1C0B0E; --accent-soft:#3A1D23; --form:#C26871; --form-soft:#2A1F21;
  --pencil:#DADDE1; --on-pencil:#15171A;
  --ok:#4FC48D; --ok-soft:#163020; --warn:#F2AA45; --warn-soft:#372913; --bad:#FF6476; --bad-soft:#3A1D23;
  --shadow:0 1px 2px rgb(0 0 0 / .4), 0 10px 30px rgb(0 0 0 / .35); color-scheme:dark;
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:650;line-height:1.2;margin:0;text-wrap:balance;letter-spacing:-.01em}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;min-height:38px;padding:0 14px;border-radius:var(--r-s);border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--sunken)}
.btn.danger{color:var(--bad)}
.btn.small{min-height:32px;padding:0 10px;font-size:14px}
.btn svg{width:18px;height:18px;flex:none}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{width:36px;height:36px;display:inline-grid;place-items:center;border-radius:var(--r-s);border:1px solid transparent;background:transparent;cursor:pointer;color:var(--muted)}
.icon-btn:hover{background:var(--sunken);color:var(--ink)}
.icon-btn svg{width:18px;height:18px}

/* top bar */
.top{border-bottom:1px solid var(--line);background:var(--surface)}
.top .wrap{display:flex;align-items:center;gap:12px 20px;flex-wrap:wrap;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand svg{width:34px;height:34px;flex:none}
.brand-name{font-family:var(--f-display);font-size:21px;font-weight:700;letter-spacing:-.02em}
.brand-sub{font-size:12.5px;color:var(--muted);display:block;margin-top:-2px}
.exam-switch{display:flex;align-items:center;gap:4px;min-width:0}
.exam-switch label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.exam-switch select{min-height:36px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--surface);padding:0 32px 0 10px;max-width:min(260px,52vw);font-weight:600}
.save-state{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.save-state i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.save-state[data-s="device"] i{background:var(--ok)}
.save-state[data-s="local"] i{background:var(--warn)}
.save-state[data-s="none"] i{background:var(--bad)}
.save-state[data-s="saving"] i{background:var(--accent);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--sunken)}
.lang button{border:0;background:transparent;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .12)}

/* steps */
.steps{display:flex;gap:4px;padding-block:14px 0;overflow-x:auto}
.step{display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:10px 14px 12px;border-bottom:2px solid transparent;cursor:pointer;color:var(--muted);font-weight:600;white-space:nowrap}
.step b{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;border:1.5px solid currentColor;font-size:12.5px;font-family:var(--f-mono)}
.step[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.step[aria-selected="true"] b{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.step .count{font-weight:500;font-size:13px;color:var(--muted)}
main{padding-block:20px 64px}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.panel h3{font-size:17px}
.kicker{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.notice{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-s);background:var(--warn-soft);color:var(--ink);font-size:14px}
.notice svg{width:18px;height:18px;flex:none;color:var(--warn);margin-top:2px}
.notice.info{background:var(--sunken)}
.notice.info svg{color:var(--muted)}
.notice ul{margin:6px 0 0;padding-left:18px}
.notice .x{margin-left:auto}

/* ---------- answer keys */
.keys-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.keys-main{display:flex;flex-direction:column;gap:16px;min-width:0}
.codebar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
.chips{display:flex;flex-wrap:wrap;gap:6px;flex:1 1 auto}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-family:var(--f-mono);font-weight:700}
.chip small{font-family:var(--f-body);font-weight:500;color:var(--muted);font-size:12px}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--surface)}
.chip[aria-pressed="true"] small{color:inherit;opacity:.75}
.chip.add{font-family:var(--f-body);font-weight:600;border-style:dashed;color:var(--muted)}
.codebar .tools{display:flex;gap:6px;flex-wrap:wrap}
.code-head{display:flex;align-items:baseline;gap:10px 16px;flex-wrap:wrap}
.code-head h2{font-size:24px}
.code-head h2 .mono{color:var(--accent)}
.code-head .spacer{margin-left:auto}
.part{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px 18px}
.part-head{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 12px;margin-bottom:12px}
.part-head h3{font-size:18px}
.part-head .muted{font-size:13.5px}
.quick{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.quick label{font-size:13px;color:var(--muted);font-weight:600}
.quick input{flex:1 1 220px;min-width:0;min-height:36px;border:1px solid var(--line);border-radius:var(--r-s);padding:0 10px;background:var(--bg);font-family:var(--f-mono);letter-spacing:.08em}
.p1grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(176px,1fr));gap:10px 18px}
.p1block{display:flex;flex-direction:column;gap:3px;padding:8px 10px;border:1px solid var(--form);border-radius:6px;background:var(--form-soft)}
.p1head,.p1row{display:grid;grid-template-columns:24px repeat(4,1fr);align-items:center;justify-items:center;gap:4px}
.p1head span{font-size:12px;font-weight:700;color:var(--muted)}
.qn{font-family:var(--f-mono);font-size:12.5px;font-weight:700;justify-self:end;padding-right:4px;color:var(--ink)}
.bub{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--form);background:var(--surface);color:var(--form);font-size:12px;font-weight:700;cursor:pointer;display:grid;place-items:center;padding:0;transition:transform .08s}
.bub:hover{border-color:var(--pencil);color:var(--pencil)}
.bub:active{transform:scale(.92)}
.bub[aria-pressed="true"]{background:var(--pencil);border-color:var(--pencil);color:var(--on-pencil)}
.p2grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px}
.p2q{border:1px solid var(--form);border-radius:6px;padding:8px 10px;background:var(--form-soft)}
.p2q.partial{border-color:var(--warn);background:var(--warn-soft)}
.p2title{font-weight:700;font-size:13.5px;text-align:center;margin-bottom:4px}
.p2head,.p2row{display:grid;grid-template-columns:20px 1fr 1fr;align-items:center;justify-items:center;gap:4px}
.p2head span{font-size:11.5px;font-weight:700;color:var(--muted)}
.p2row .qn{justify-self:start;font-family:var(--f-body)}
.p3grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.p3cell{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:13.5px}
.p3cell input{min-height:40px;border:1px solid var(--form);border-radius:6px;padding:0 10px;background:var(--surface);font-family:var(--f-mono);font-size:16px;font-weight:700;width:100%}
.p3cell input.bad{border-color:var(--bad);background:var(--bad-soft)}
.p3cell small{font-weight:500;color:var(--bad);font-size:12px;min-height:1em}
.hint{font-size:13px;color:var(--muted);margin:10px 0 0}
.side{display:flex;flex-direction:column;gap:16px;position:sticky;top:16px}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 16px}
.field{display:grid;grid-template-columns:72px 76px 1fr;align-items:center;gap:8px;margin-bottom:10px}
.field label{font-weight:600;font-size:14px}
.field span{font-size:13px;color:var(--muted)}
.pt{min-height:36px;border:1px solid var(--line);border-radius:var(--r-s);padding:0 8px;background:var(--bg);font-family:var(--f-mono);font-weight:700;width:100%;text-align:right}
.tiers{border:0;margin:4px 0 12px;padding:0}
.tiers legend{font-weight:600;font-size:14px;padding:0;margin-bottom:6px}
.tiers .row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tiers label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.maxline{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);padding-top:12px;margin-top:6px}
.maxline b{font-family:var(--f-display);font-size:26px;color:var(--accent)}
.empty{display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding:28px}
.empty h2{font-size:22px}
.empty p{margin:0;color:var(--muted);max-width:56ch}
.empty .actions{display:flex;gap:8px;flex-wrap:wrap}
.howto{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;width:100%;margin-top:6px}
.howto div{border-top:2px solid var(--form);padding-top:8px;font-size:14px}
.howto b{display:block;font-family:var(--f-display);font-size:15px}

/* ---------- grading */
.grade-layout{display:grid;grid-template-columns:320px minmax(0,1fr);gap:20px;align-items:start}
.intake{display:flex;flex-direction:column;gap:12px;position:sticky;top:16px}
.drop{border:2px dashed var(--form);border-radius:var(--r);background:var(--form-soft);padding:22px 18px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;transition:background .15s,border-color .15s}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop svg.big{width:44px;height:44px;color:var(--accent)}
.drop h3{font-size:17px}
.drop p{margin:0;font-size:13.5px;color:var(--muted)}
.drop .actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.tips{font-size:13px;color:var(--muted);margin:0;padding:0 4px}
.progress{padding:12px 14px}
.progress .bar{height:6px;border-radius:3px;background:var(--sunken);overflow:hidden;margin-top:8px}
.progress .bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.ledger{display:flex;flex-direction:column;gap:14px;min-width:0}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.stat{padding:12px 14px;border-left:1px solid var(--line);min-width:0}
.stat:first-child{border-left:0}
.stat .kicker{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat b{display:block;font-family:var(--f-display);font-size:24px;font-variant-numeric:tabular-nums;line-height:1.25}
.stat.attn b{color:var(--warn)}
.ledger-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ledger-bar h2{font-size:19px;margin-right:auto}
.ledger-bar select{min-height:32px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--surface);padding:0 8px;font-size:14px}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
td{padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--sunken)}
td.r,th.r{text-align:right}
td.total{font-family:var(--f-display);font-size:18px;font-weight:700;color:var(--accent);text-align:right}
td .sub{font-size:12px;color:var(--muted);display:block;line-height:1.2}
td.file{max-width:180px;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.check{background:var(--warn-soft);color:var(--warn)}
.pill.checked{background:var(--sunken);color:var(--muted)}
.pill.error,.pill.nokey{background:var(--bad-soft);color:var(--bad)}
.rowdel{opacity:.6}
tr:hover .rowdel{opacity:1}

/* ---------- review */
.review{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.rv-top{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);background:var(--surface);padding-block:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.rv-title{min-width:0;flex:1}
.rv-title b{display:block;font-family:var(--f-display);font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rv-title span{font-size:12.5px;color:var(--muted)}
.rv-nav{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--muted)}
.rv-body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 380px}
.rv-sheet{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line);background:var(--sunken)}
.rv-tools{display:flex;align-items:center;gap:8px;padding:8px 12px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.rv-tools .legend{display:flex;gap:12px;flex-wrap:wrap;margin-left:auto}
.rv-tools .legend span{display:inline-flex;align-items:center;gap:5px}
.rv-tools .legend i{width:12px;height:12px;border-radius:50%;border:2px solid;display:inline-block}
.rv-scroll{flex:1;min-height:0;overflow:auto;padding:0 12px 16px}
.rv-canvas{position:relative;width:100%;max-width:820px;margin:0 auto;aspect-ratio:595/842;background:var(--m-paper);box-shadow:var(--shadow);border-radius:4px;overflow:hidden}
.rv-canvas.zoom{max-width:none;width:200%}
.rv-canvas img,.rv-canvas svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.rv-canvas svg text{font-family:var(--f-body);fill:var(--m-text);user-select:none}
svg .b{fill:transparent;stroke:transparent;stroke-width:1.3;cursor:pointer}
svg .b:hover{stroke:var(--m-info);stroke-width:1.6}
svg .b.o{stroke:var(--m-form);stroke-width:.7}
svg .b.f.o{fill:var(--m-pencil);stroke:var(--m-pencil)}
svg .ring{fill:none;pointer-events:none;stroke-width:1.5}
svg .ring.ok{stroke:var(--m-ok)}
svg .ring.bad{stroke:var(--m-bad)}
svg .ring.want{stroke:var(--m-ok);stroke-dasharray:2 1.4}
svg .ring.info{stroke:var(--m-info)}
svg .fl{fill:rgb(242 154 0 / .14);stroke:var(--m-warn);stroke-width:1.2;pointer-events:none}
svg .fl.hot{animation:flash 1.2s 2}
@keyframes flash{50%{fill:rgb(242 154 0 / .45)}}
.rv-side{overflow:auto;padding:16px 18px 24px;display:flex;flex-direction:column;gap:18px;background:var(--surface)}
.scorebox{display:flex;align-items:flex-end;gap:14px}
.scorebox .big{font-family:var(--f-display);font-weight:700;font-size:52px;line-height:.9;color:var(--accent);font-variant-numeric:tabular-nums}
.scorebox .of{color:var(--muted);font-size:14px;padding-bottom:4px}
.parts{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;font-size:14px;align-items:baseline}
.parts b{font-variant-numeric:tabular-nums;text-align:right}
.idrow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.idrow div{background:var(--sunken);border-radius:var(--r-s);padding:8px 10px}
.idrow .mono{font-size:20px;font-weight:700;display:block}
.keypick{display:flex;align-items:center;gap:8px;font-size:14px;flex-wrap:wrap}
.keypick select{min-height:34px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--surface);padding:0 8px;font-family:var(--f-mono);font-weight:700}
.issues{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.issues button{all:unset;cursor:pointer;display:flex;gap:8px;align-items:flex-start;font-size:14px;padding:6px 8px;border-radius:6px;background:var(--warn-soft);width:100%;box-sizing:border-box}
.issues button:focus-visible{outline:2px solid var(--accent)}
.issues .dot{width:8px;height:8px;border-radius:50%;background:var(--warn);margin-top:7px;flex:none}
.issues .info{background:var(--sunken)}
.issues .info .dot{background:var(--muted)}
.ansgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:4px}
.ans{font-family:var(--f-mono);font-size:12.5px;border-radius:5px;padding:3px 0;text-align:center;background:var(--sunken);color:var(--muted)}
.ans b{font-weight:700}
.ans.ok{background:var(--ok-soft);color:var(--ok)}
.ans.bad{background:var(--bad-soft);color:var(--bad)}
.p2list,.p3list{display:flex;flex-direction:column;gap:4px;font-size:13.5px}
.p2list div,.p3list div{display:flex;gap:10px;align-items:baseline}
.p2list .tag,.p3list .tag{width:52px;flex:none;color:var(--muted)}
.subs{font-family:var(--f-mono);display:inline-flex;gap:2px}
.subs i{font-style:normal;width:18px;text-align:center;border-radius:3px}
.subs i.ok{background:var(--ok-soft);color:var(--ok)}
.subs i.bad{background:var(--bad-soft);color:var(--bad)}
.p3list .mono{font-weight:700}
.rv-side h4{margin:0 0 8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.rv-foot{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- live scanner (one dark camera look in both themes) */
.live{position:fixed;inset:0;z-index:45;background:#000;color:#fff;overflow:hidden;--lv-ok:#12B76A;--lv-warn:#F29A00}
.live video,.live canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.lv-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.lv-flash.on{animation:lvflash .4s ease-out}
@keyframes lvflash{0%{opacity:.75}100%{opacity:0}}
.lv-top{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:10px;padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:linear-gradient(rgb(0 0 0 / .6),transparent)}
.lv-top b{font-family:var(--f-display);font-size:18px;flex:1;min-width:0}
.lv-count{font-size:14px;opacity:.9;white-space:nowrap}
.lv-top .btn{background:rgb(255 255 255 / .16);border-color:transparent;color:#fff}
.lv-icon{color:#fff}
.lv-icon:hover{background:rgb(255 255 255 / .16);color:#fff}
.lv-icon[aria-pressed="true"]{background:#FFD24D;color:#000}
.lv-guide{position:absolute;left:50%;transform:translateX(-50%);top:calc(66px + env(safe-area-inset-top,0px));background:rgb(0 0 0 / .62);padding:8px 16px;border-radius:999px;font-weight:600;font-size:15px;width:max-content;max-width:calc(100% - 32px);text-align:center;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.lv-guide.ok{background:rgb(14 140 84 / .92)}
.lv-guide.warn{background:rgb(170 98 0 / .94)}
.lv-bottom{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;gap:14px;align-items:center;padding-top:36px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:linear-gradient(transparent,rgb(0 0 0 / .65))}
.lv-card{width:100%;max-width:520px;background:var(--surface);color:var(--ink);border-radius:16px;padding:12px 14px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;align-items:center;box-shadow:0 8px 30px rgb(0 0 0 / .35)}
.lv-card .big{font-family:var(--f-display);font-size:46px;font-weight:700;color:var(--accent);line-height:1;font-variant-numeric:tabular-nums}
.lv-meta{display:flex;flex-direction:column;min-width:0;font-size:14px}
.lv-meta b{font-size:16px}
.lv-meta span{color:var(--muted)}
.lv-meta em{font-style:normal;color:var(--warn);font-weight:600}
.lv-acts{grid-column:1 / -1;display:flex;gap:8px;justify-content:flex-end}
.lv-dup{grid-column:1 / -1;display:flex;gap:10px;align-items:flex-start;font-size:14px}
.lv-dup svg{width:20px;height:20px;color:var(--warn);flex:none;margin-top:1px}
.lv-shutter{width:76px;height:76px;border-radius:50%;border:4px solid #fff;background:transparent;padding:5px;cursor:pointer;flex:none}
.lv-shutter span{display:block;width:100%;height:100%;border-radius:50%;background:#fff;transition:transform .1s}
.lv-shutter:active span{transform:scale(.88)}
.lv-shutter:disabled{opacity:.45}
.lv-fallback{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:18px;background:var(--bg);color:var(--ink);padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.lv-fb-actions{display:flex;gap:10px;flex-wrap:wrap}
.scan-msg{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.scan-msg svg{width:42px;height:42px;color:var(--warn)}
.scan-msg h2{font-size:23px}
.scan-msg p{margin:0;color:var(--muted);max-width:52ch}
.drop .btn.big{min-height:50px;font-size:16px;padding:0 20px}
body.live-on .toast{top:calc(118px + env(safe-area-inset-top,0px));bottom:auto}
.foot{padding-block:8px 40px}
.foot-inner{display:flex;gap:12px 24px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:18px}
.foot-inner > div:first-child{flex:1 1 320px}
.foot-inner b{font-family:var(--f-display);font-size:15px}
.foot-inner p{margin:4px 0 0;font-size:13.5px;color:var(--muted);max-width:70ch}
.foot-acts{display:flex;gap:8px;flex-wrap:wrap}

/* modal + toast */
.modal{position:fixed;inset:0;z-index:60;background:rgb(10 12 14 / .45);display:grid;place-items:center;padding:16px}
.modal-card{width:min(420px,100%);background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:12px}
.modal-card h3{font-size:18px}
.modal-card p{margin:0;color:var(--muted);font-size:14px}
.modal-card input{min-height:40px;border:1px solid var(--line);border-radius:var(--r-s);padding:0 10px;background:var(--bg)}
.modal-actions{display:flex;justify-content:flex-end;gap:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:999px;font-size:14px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

@media (max-width:980px){
  .keys-layout,.grade-layout{grid-template-columns:minmax(0,1fr)}
  .side,.intake{position:static}
  .rv-body{grid-template-columns:minmax(0,1fr);overflow:auto}
  .rv-sheet{border-right:0;border-bottom:1px solid var(--line)}
  .rv-scroll{overflow:visible}
  .rv-side{overflow:visible}
}
@media (max-width:640px){
  .stats{grid-template-columns:repeat(3,minmax(0,1fr))}
  .stat:nth-child(4){border-left:0}
  .stat:nth-child(n+4){border-top:1px solid var(--line)}
  .brand-sub{display:none}
  .exam-switch label{display:none}
  .rv-canvas.zoom{width:260%}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <svg viewBox="0 0 34 34" aria-hidden="true"><circle cx="15" cy="17" r="12" fill="none" stroke="var(--form)" stroke-width="2"/><circle cx="15" cy="17" r="7.5" fill="var(--pencil)"/><path d="M19 21.5l4.2 4.5L32 13" fill="none" stroke="var(--accent)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>

    </div>
    <div class="exam-switch">

      <select id="examSel"></select>
      <button class="icon-btn" id="examNew" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="icon-btn" id="examRename" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4z"/></svg></button>
      <button class="icon-btn" id="examDelete" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg></button>
    </div>
    <button class="btn small primary" id="installBtn" type="button" hidden><span data-t="install"></span></button>
    <div class="save-state" id="saveState" data-s="loading"><i></i><span></span></div>
    <div class="lang" role="group" aria-label="Language"><button type="button" data-lang="vi">VI</button><button type="button" data-lang="en">EN</button></div>
  </div>
  <div class="wrap">
    <nav class="steps" role="tablist">
      <button class="step" role="tab" id="tab-keys" data-tab="keys" type="button"><b>1</b><span data-t="tabKeys"></span><span class="count" id="cntKeys"></span></button>
      <button class="step" role="tab" id="tab-grade" data-tab="grade" type="button"><b>2</b><span data-t="tabGrade"></span><span class="count" id="cntGrade"></span></button>
    </nav>
  </div>
</header>
<main class="wrap" id="view"></main>
<footer class="wrap foot">
  <div class="foot-inner">
    <div><b data-t="dataT"></b><p data-t="dataB"></p></div>
    <div class="foot-acts">
      <button class="btn small" id="backupBtn" type="button"><span data-t="backup"></span></button>
      <button class="btn small ghost" id="restoreBtn" type="button"><span data-t="restore"></span></button>
    </div>
  </div>
</footer>

<div class="review" id="review" hidden role="dialog" aria-modal="true" aria-labelledby="rvName">
  <div class="rv-top">
    <button class="icon-btn" id="rvClose" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="rv-title"><b id="rvName"></b><span id="rvSub"></span></div>
    <div class="rv-nav">
      <button class="icon-btn" id="rvPrev" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
      <span id="rvPos" class="num"></span>
      <button class="icon-btn" id="rvNext" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>
  </div>
  <div class="rv-body">
    <div class="rv-sheet">
      <div class="rv-tools">
        <button class="btn small" id="rvZoom" type="button"></button>
        <span id="rvHint"></span>
        <div class="legend" id="rvLegend"></div>
      </div>
      <div class="rv-scroll"><div class="rv-canvas" id="rvCanvas"></div></div>
    </div>
    <aside class="rv-side" id="rvSide"></aside>
  </div>
</div>

<div class="live" id="live" hidden role="dialog" aria-modal="true" aria-labelledby="lvTitle">
  <video id="lvVideo" playsinline muted autoplay></video>
  <canvas id="lvOverlay" aria-hidden="true"></canvas>
  <div class="lv-flash" id="lvFlash"></div>
  <div class="lv-top">
    <b id="lvTitle"></b>
    <span class="lv-count num" id="lvCount"></span>
    <button class="icon-btn lv-icon" id="lvTorch" type="button" aria-pressed="false" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg></button>
    <button class="btn small" id="lvDone" type="button"></button>
  </div>
  <div class="lv-guide" id="lvGuide" role="status" aria-live="polite"></div>
  <div class="lv-bottom">
    <div class="lv-card" id="lvCard" hidden></div>
    <button class="lv-shutter" id="lvShutter" type="button"><span></span></button>
  </div>
  <div class="lv-fallback" id="lvFallback" hidden></div>
</div>

<div class="modal" id="modal" hidden>
  <form class="modal-card" id="mdForm">
    <h3 id="mdTitle"></h3>

    <input id="mdInput" autocomplete="off">
    <div class="modal-actions"><button class="btn" type="button" id="mdCancel"></button><button class="btn primary" type="submit" id="mdOk"></button></div>
  </form>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<input type="file" id="fileIn" multiple accept="image/*,application/pdf,.pdf" hidden>

// ---------------------------------------------------------------- derived results
function bitsOf(r) { return r._bits || (r._bits = Logic.hexToBits(r.bits || '', NB)); }
function ansOf(r) { return r._ans || (r._ans = OMR.decode(bitsOf(r))); }
function groupLabel(g) {
  if (g.kind === 'sbd') return t('lSbd', { c: g.col + 1 });
  if (g.kind === 'made') return t('lMade', { c: g.col + 1 });
  if (g.kind === 'p1') return t('lP1', { q: g.q });
  if (g.kind === 'p2') return t('lP2', { q: g.q, s: 'abcd'[g.sub] });
  return t('lP3', { q: g.q });
}
function derive(r, ex, dupes) {
  if (r.err) return { status: 'error', issues: [], score: null };
  const ans = ansOf(r), codes = Object.keys(ex.keys);
  const issues = [];
  let code = null;
  if (r.keyCode && ex.keys[r.keyCode]) code = r.keyCode;
  else if (ex.keys[ans.made]) code = ans.made;
  else if (codes.length === 1) {
    code = codes[0];
    if (ans.made === '___') issues.push({ type: 'info', text: t('iAuto', { code }) });
    else issues.push({ type: 'warn', text: t('iAutoDiff', { made: ans.made, code }), group: 'made0' });
  } else if (codes.length) issues.push({ type: 'warn', text: t('iNoKey', { made: ans.made }), group: 'made0' });
  if (r.keyCode && code === r.keyCode && r.keyCode !== ans.made) issues.push({ type: 'info', text: t('iAutoDiff', { made: ans.made, code }) });
  Object.entries(r.flags || {}).forEach(([gk, f]) => {
    const gi = TPL.groupIndex[gk];
    if (gi == null) return;
    issues.push({ type: 'warn', text: t(f === 'multi' ? 'iMulti' : 'iUnsure', { label: groupLabel(TPL.groups[gi]) }), group: gk });
  });
  // multi-marks the reader was sure about still need attention
  TPL.groups.forEach(g => {
    if (r.flags && r.flags[g.key]) return;
    if (g.kind === 'p3') return;
    const on = g.members.filter(i => bitsOf(r)[i]).length;
    if (on > 1) issues.push({ type: 'warn', text: t('iMulti', { label: groupLabel(g) }), group: g.key });
  });
  if (/[_?]/.test(ans.sbd)) issues.push({ type: 'warn', text: t('iSbd'), group: 'sbd' + Math.max(0, ans.sbd.search(/[_?]/)) });
  else if (dupes && dupes.has(ans.sbd)) issues.push({ type: 'warn', text: t('iDup', { sbd: ans.sbd }), group: 'sbd0' });
  ans.p3raw.forEach((cols, q) => {
    const label = t('lP3', { q: q + 1 });
    const last = cols.reduce((m, c, i) => c !== null ? i : m, -1);
    if (last > 0 && cols.slice(0, last).some(c => c === null)) issues.push({ type: 'warn', text: t('iGap', { label }), group: `p3_${q + 1}_0` });
    const s = ans.p3[q];
    if (s && s !== '*' && !Logic.p3Valid(s)) issues.push({ type: 'warn', text: t('iInvalid', { label, v: s }), group: `p3_${q + 1}_0` });
  });
  const score = code ? Logic.score(ans, ex.keys[code], ex.settings) : null;
  const warn = issues.some(i => i.type === 'warn');
  const status = !code ? 'nokey' : (r.reviewed ? 'checked' : (warn ? 'check' : 'ok'));
  return { ans, code, issues, score, status, max: code ? Logic.maxScore(ex.keys[code], ex.settings) : null };
}
function deriveAll(ex) {
  const list = resultsOf(ex.id);
  const seen = {}, dupes = new Set();
  list.forEach(r => { if (r.err) return; const s = ansOf(r).sbd; if (!/[_?]/.test(s)) { if (seen[s]) dupes.add(s); seen[s] = 1; } });
  return list.map(r => ({ r, d: derive(r, ex, dupes) }));
}

  if (isTouch() && navigator.canShare) {
    try {
      const file = new File([blob], filename, { type });
      if (navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: filename }); return; }
    } catch (e) { if (e && e.name === 'AbortError') return; }
  }
  const url = URL.createObjectURL(blob);

// ---------------------------------------------------------------- reading files
async function decodeImage(file) {
  let src, w, h;
  try { src = await createImageBitmap(file); w = src.width; h = src.height; }
  catch (e) {
    src = await new Promise((res, rej) => {
      const img = new Image(), url = URL.createObjectURL(file);
      img.onload = () => { URL.revokeObjectURL(url); res(img); };
      img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('decode')); };
      img.src = url;
    });
    w = src.naturalWidth; h = src.naturalHeight;
  }
  const s = Math.min(1, 2000 / Math.max(w, h));
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(w * s)); c.height = Math.max(1, Math.round(h * s));
  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(src, 0, 0, c.width, c.height);
  if (src.close) src.close();
  return ctx.getImageData(0, 0, c.width, c.height);
}
async function viewBlob(view) {
  const c = document.createElement('canvas');
  c.width = view.w; c.height = view.h;
  c.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(view.data.buffer || view.data), view.w, view.h), 0, 0);
  return new Promise(res => c.toBlob(res, 'image/jpeg', 0.84));
}
async function makeResult(res, name, page) {
  const r = { id: 'r' + uid(), file: name, page, at: Date.now(), bits: Logic.bitsToHex(res.filled), flags: res.flags || {}, _bits: res.filled, _ans: res.answers };
  if (res.view) {
    const blob = await viewBlob(res.view);
    if (blob) { r._blob = blob; S.views.set(r.id, URL.createObjectURL(blob)); }
  }
  return r;
}
function keepResult(ex, r) {
  resultsOf(ex.id).push(r);
  if (r._blob) { Store.putImage(r.id, r._blob); delete r._blob; }
  markDirty('res', ex.id);
}
function dropView(r) { const u = S.views.get(r.id); if (u) URL.revokeObjectURL(u); S.views.delete(r.id); }
function forgetResults(list) { list.forEach(r => { dropView(r); Store.delImage(r.id); }); }
async function readSheet(imgData, file, page, ex) {
  const res = OMR.analyze(imgData.data, imgData.width, imgData.height, { maxDim: 2000, viewScale: 1.4 });
  if (!res.ok) {
    const r = { id: 'r' + uid(), file: file.name || 'image', page, at: Date.now(), err: res.code, bits: '', flags: {} };
    resultsOf(ex.id).push(r);
    return r;
  }
  const r = await makeResult(res, file.name || 'image', page);
  keepResult(ex, r);
  return r;
}
async function handleFiles(fileList) {
  const files = Array.from(fileList || []).filter(f => /^image\//.test(f.type) || f.type === 'application/pdf' || /\.(pdf|jpe?g|png|webp|bmp|gif|tiff?|heic|heif)$/i.test(f.name));
  if (!files.length || S.busy) return;
  const ex = curExam();
  S.tab = 'grade';
  const before = resultsOf(ex.id).length;
  setProgress(t('reading', { i: 1, n: files.length }), 0);
  render();
  for (let fi = 0; fi < files.length; fi++) {
    const f = files[fi];
    const isPdf = f.type === 'application/pdf' || /\.pdf$/i.test(f.name);
    if (isPdf) {
      if (!(await ensureLib('pdf'))) continue;
      let doc;
      try { doc = await pdfjsLib.getDocument({ data: new Uint8Array(await f.arrayBuffer()), isEvalSupported: false }).promise; }
      catch (e) { resultsOf(ex.id).push({ id: 'r' + uid(), file: f.name, page: 1, at: Date.now(), err: 'pdf', bits: '', flags: {} }); continue; }
      for (let p = 1; p <= doc.numPages; p++) {
        setProgress(t('readingPage', { f: f.name, p, n: doc.numPages }), (fi + (p - 1) / doc.numPages) / files.length);
        await tick();
        try {
          const page = await doc.getPage(p);
          const v1 = page.getViewport({ scale: 1 });
          const vp = page.getViewport({ scale: 2000 / Math.max(v1.width, v1.height) });
          const c = document.createElement('canvas');
          c.width = Math.round(vp.width); c.height = Math.round(vp.height);
          const ctx = c.getContext('2d', { willReadFrequently: true });
          ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
          await page.render({ canvasContext: ctx, viewport: vp }).promise;
          await readSheet(ctx.getImageData(0, 0, c.width, c.height), f, p, ex);
        } catch (e) { resultsOf(ex.id).push({ id: 'r' + uid(), file: f.name, page: p, at: Date.now(), err: 'pdf', bits: '', flags: {} }); }
        await tick();
      }
    } else {
      setProgress(t('reading', { i: fi + 1, n: files.length }), fi / files.length);
      await tick();
      try { await readSheet(await decodeImage(f), f, 1, ex); }
      catch (e) { resultsOf(ex.id).push({ id: 'r' + uid(), file: f.name, page: 1, at: Date.now(), err: 'decode', bits: '', flags: {} }); }
    }
    setProgress(S.busy.text, (fi + 1) / files.length);
    if (S.tab === 'grade' && S.examId === ex.id) render();
  }
  S.busy = null;
  markDirty('res', ex.id);
  const added = resultsOf(ex.id).slice(before);
  const rows = deriveAll(ex).filter(x => added.includes(x.r));
  const nc = rows.filter(x => ['check', 'error', 'nokey'].includes(x.d.status)).length;
  if (S.examId === ex.id) render();
  toast(nc ? t('doneCheck', { n: added.length, c: nc }) : added.length === 1 ? t('done1') : t('done', { n: added.length }));
}

const LV = { stream: null, track: null, worker: null, noWorker: false, reqs: {}, rid: 0, timer: null, busy: false, state: 'off', stable: 0, lost: 0, prev: null, quad: null, good: false, fails: 0, count: 0, lastId: null, dup: null, wake: null, torch: false, audio: null, paused: false, dc: null, fc: null };
function lvWorker() {
  if (!LV.worker) {
    LV.worker = new Worker('scan-worker.js');
    LV.worker.onmessage = e => { const cb = LV.reqs[e.data.id]; delete LV.reqs[e.data.id]; if (cb) cb(e.data); };
    LV.worker.onerror = () => { LV.noWorker = true; const cbs = Object.values(LV.reqs); LV.reqs = {}; cbs.forEach(cb => cb({ ok: false, code: 'worker' })); };
  }
  return LV.worker;
}
function lvRun(msg, transfer) {
  if (!LV.noWorker) {
    try {
      const w = lvWorker();
      return new Promise(res => { const id = ++LV.rid; LV.reqs[id] = res; w.postMessage(Object.assign({ id }, msg), transfer || []); });
    } catch (e) { LV.noWorker = true; }
  }
  return Promise.resolve(OMR.task(msg).msg);
}

    if (key ? !(sc && sc.d2[q]) : !d.ans.p2[q].some(v => v)) continue;
    const dd = sc && sc.d2[q];
    p2 += `<div><span class="tag">${t('q', { q: q + 1 })}</span><span class="subs">${d.ans.p2[q].map((v, s) => `<i class="${dd ? (dd[s] ? 'ok' : 'bad') : ''}" title="${dd && !dd[s] ? esc(t('keyIs', { k: tfLabel(key.p2[q][s]) })) : ''}">${tfLabel(v)}</i>`).join('')}</span>${dd ? `<span class="muted num">${sc.p2.perQ[q]}/4</span>` : ''}</div>`;
  }
  for (let q = 0; q < 6; q++) {
    if (key ? !Logic.normNum(key.p3[q]) : !d.ans.p3[q]) continue;
    const ok = sc ? sc.d3[q] : null;
    p3 += `<div><span class="tag">${t('q', { q: q + 1 })}</span><span class="mono" style="color:${ok === true ? 'var(--ok)' : ok === false ? 'var(--bad)' : 'inherit'}">${esc(d.ans.p3[q] || '–')}</span>${ok === false ? `<span class="muted">${esc(t('keyIs', { k: key.p3[q] }))}</span>` : ''}</div>`;
  }
  $('#rvSide').innerHTML = `
    ${scoreBlock}
    <div class="idrow"><div><span class="kicker">${t('sbd')}</span><span class="mono">${esc(d.ans.sbd)}</span></div><div><span class="kicker">${t('made')}</span><span class="mono">${esc(d.ans.made)}</span></div></div>
    ${keyPick}
    <div><h4>${t('issues')}</h4>${iss}</div>
    ${p1 ? `<div><h4>${t('part1')}</h4><div class="ansgrid">${p1}</div></div>` : ''}
    ${p2 ? `<div><h4>${t('part2')}</h4><div class="p2list">${p2}</div></div>` : ''}
    ${p3 ? `<div><h4>${t('part3')}</h4><div class="p3list">${p3}</div></div>` : ''}
    <div class="rv-foot">
      <button class="btn ${r.reviewed ? '' : 'primary'}" type="button" id="rvMark">${r.reviewed ? t('unmark') : t('markChecked')}</button>
    </div>`;
}
function stepReview(dir) {
  const list = reviewList();
  const idx = list.findIndex(x => x.r.id === S.reviewId);
  const nx = list[idx + dir];
  if (nx) { S.reviewId = nx.r.id; renderReview(); $('.rv-scroll').scrollTop = 0; }
}
function toggleBubble(i) {
  const ex = curExam();
  const r = resultsOf(ex.id).find(x => x.id === S.reviewId);
  if (!r) return;
  const bits = bitsOf(r);
  bits[i] = bits[i] ? 0 : 1;
  r.bits = Logic.bitsToHex(bits);
  r._ans = null;
  const gk = TPL.groups[TPL.bubbles[i].g].key;
  if (r.flags) delete r.flags[gk];
  markDirty('res', ex.id);
  const sc = $('.rv-scroll'), top = sc.scrollTop, left = sc.scrollLeft;
  renderReview();
  sc.scrollTop = top; sc.scrollLeft = left;
}

// ---------------------------------------------------------------- events
document.addEventListener('click', async e => {
  const langBtn = e.target.closest('.lang button');
  if (langBtn) {
    LANG = langBtn.dataset.lang;
    try { localStorage.setItem('cp-lang', LANG); } catch (er) { }
    applyStatic(); render(); if (S.reviewId) renderReview(); if (S.live) { paintLiveStatic(); paintGuide(); paintCard(); }
    return;
  }
  const stepBtn = e.target.closest('.step');
  if (stepBtn) { S.tab = stepBtn.dataset.tab; render(); return; }
  const el = e.target.closest('[data-act]');
  if (!el || !$('#view').contains(el)) return;
  const act = el.dataset.act, ex = curExam();
  if (act === 'code') { S.activeCode = el.dataset.code; render(); }
  else if (act === 'addCode') addCode();
  else if (act === 'delCode') {
    const ok = await ask({ title: t('delCode'), body: t('delCodeBody', { code: S.activeCode }), ok: t('del'), danger: true });
    if (ok) { delete ex.keys[S.activeCode]; S.activeCode = null; keyChanged(true); }
  }
  else if (act === 'k1') {
    const q = +el.dataset.q, v = el.dataset.v, key = ex.keys[S.activeCode];
    key.p1[q] = key.p1[q] === v ? '' : v;
    el.parentNode.querySelectorAll('.bub').forEach(b => b.setAttribute('aria-pressed', String(key.p1[q] === b.dataset.v)));
    keyChanged(false);
  }
  else if (act === 'k2') {
    const q = +el.dataset.q, s = +el.dataset.s, v = el.dataset.v, key = ex.keys[S.activeCode];
    const was = Logic.keyStats(key).p2partial.includes(q + 1);
    key.p2[q][s] = key.p2[q][s] === v ? '' : v;
    el.parentNode.querySelectorAll('.bub').forEach(b => b.setAttribute('aria-pressed', String(key.p2[q][s] === b.dataset.v)));
    const now = Logic.keyStats(key).p2partial.includes(q + 1);
    keyChanged(was !== now);
  }
  else if (act === 'quick1') applyQuick1();
  else if (act === 'quick2') applyQuick2();
  else if (act === 'preset') { ex.settings = Logic.cloneSettings(Logic.PRESETS[el.dataset.p]); keyChanged(true); }
  else if (act === 'import') $('#xlsIn').click();
  else if (act === 'template') downloadTemplate();
  else if (act === 'dismissProb') { S.importProblems = null; render(); }
  else if (act === 'example') loadExample();
  else if (act === 'choose') $('#fileIn').click();
  else if (act === 'camera') openLive();
  else if (act === 'export') exportResults();
  else if (act === 'clearAll') {
    const n = resultsOf(ex.id).length;
    const ok = await ask({ title: t('clearAll'), body: t('clearAllBody', { n, name: ex.name }), ok: t('del'), danger: true });
    if (ok) { forgetResults(resultsOf(ex.id)); S.results[ex.id] = []; markDirty('res', ex.id); render(); }
  }
  else if (act === 'delRow') {
    e.stopPropagation();
    forgetResults(resultsOf(ex.id).filter(r => r.id === el.dataset.id));
    S.results[ex.id] = resultsOf(ex.id).filter(r => r.id !== el.dataset.id);
    markDirty('res', ex.id); render();
  }
  else if (act === 'open') openReview(el.dataset.id);
});
$('#view').addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('tr[data-act="open"]')) { e.preventDefault(); openReview(e.target.dataset.id); }
  if (e.key === 'Enter' && e.target.id === 'quick1') applyQuick1();
  if (e.key === 'Enter' && e.target.id === 'quick2') applyQuick2();
});
$('#view').addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.act === 'k3') {
    const ex = curExam(), key = ex.keys[S.activeCode];
    key.p3[+el.dataset.q] = el.value.trim();
    const bad = el.value.trim() && !Logic.p3Bubbleable(el.value);
    el.classList.toggle('bad', !!bad);
    el.nextElementSibling.textContent = bad ? t('p3bad') : '';
    keyChanged(false);
  }
});
$('#view').addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.act === 'st') {
    const ex = curExam(), v = parseNum(el.value), f = el.dataset.f;
    if (v == null) { toast(t('badNum')); render(); return; }
    if (f === 'p1') ex.settings.p1 = v; else if (f === 'p3') ex.settings.p3 = v; else ex.settings.p2[+f.slice(1)] = v;
    el.value = fmt(v);
    keyChanged(false);
  }
  if (el.id === 'sortSel') { S.sort = el.value; render(); }
});
$('#examSel').addEventListener('change', e => { S.examId = e.target.value; S.activeCode = null; S.importProblems = null; rememberExam(); render(); });
$('#examNew').addEventListener('click', async () => {
  const name = await ask({ title: t('newExam'), input: t('examNameAsk'), value: t('examDefault', { n: S.exams.length + 1 }), ok: t('save') });
  if (!name) return;
  const ex = newExam(name, true);
  S.examId = ex.id; S.activeCode = null; S.tab = 'keys'; rememberExam(); render();
});
$('#examRename').addEventListener('click', async () => {
  const ex = curExam();
  const name = await ask({ title: t('rename'), input: t('examNameAsk'), value: ex.name, ok: t('save') });
  if (!name) return;
  ex.name = name; markDirty('exam', ex.id); render();
});
$('#examDelete').addEventListener('click', async () => {
  const ex = curExam();
  const ok = await ask({ title: t('delExam'), body: t('delExamBody', { name: ex.name, n: resultsOf(ex.id).length }), ok: t('del'), danger: true });
  if (!ok) return;
  S.exams = S.exams.filter(e => e.id !== ex.id);
  forgetResults(resultsOf(ex.id));
  delete S.results[ex.id];
  markDirty('exam', ex.id); markDirty('res', ex.id);
  if (!S.exams.length) newExam(t('examDefault', { n: 1 }), false);
  S.examId = S.exams[S.exams.length - 1].id; S.activeCode = null; rememberExam(); render();
});
$('#fileIn').addEventListener('change', e => { handleFiles(e.target.files); e.target.value = ''; });
$('#camIn').addEventListener('change', e => { handleFiles(e.target.files); e.target.value = ''; });
$('#lvDone').addEventListener('click', closeLive);
$('#lvShutter').addEventListener('click', () => {
  if (!LV.stream || LV.state === 'reading') return;
  if (LV.dup) { dropView(LV.dup.r); LV.dup = null; }
  lvCapture(true);
});
$('#lvTorch').addEventListener('click', async () => {
  if (!LV.track) return;
  LV.torch = !LV.torch;
  try { await LV.track.applyConstraints({ advanced: [{ torch: LV.torch }] }); } catch (e) { LV.torch = false; }
  $('#lvTorch').setAttribute('aria-pressed', String(LV.torch));
});
$('#live').addEventListener('click', e => {
  const b = e.target.closest('[data-lv]');
  if (!b) return;
  const k = b.dataset.lv, ex = curExam();
  if (k === 'done') closeLive();
  else if (k === 'photo') { closeLive(); $('#camIn').click(); }
  else if (k === 'detail' && LV.lastId) { LV.paused = true; $('#live').hidden = true; openReview(LV.lastId); }
  else if (k === 'rescan' && LV.lastId) {
    forgetResults(resultsOf(ex.id).filter(x => x.id === LV.lastId));
    S.results[ex.id] = resultsOf(ex.id).filter(x => x.id !== LV.lastId);
    markDirty('res', ex.id);
    LV.lastId = null; LV.count = Math.max(0, LV.count - 1); LV.state = 'searching'; LV.stable = 0;
    toast(t('rescanNote')); paintCard(); paintGuide(); render();
  }
  else if (k === 'skip' && LV.dup) { dropView(LV.dup.r); LV.dup = null; paintCard(); paintGuide(); drawOverlay(); }
  else if (k === 'replace' && LV.dup) {
    const old = resultsOf(ex.id).filter(x => x.id === LV.dup.prevId);
    forgetResults(old);
    S.results[ex.id] = resultsOf(ex.id).filter(x => x.id !== LV.dup.prevId);
    keepResult(ex, LV.dup.r);
    LV.lastId = LV.dup.r.id; LV.dup = null; LV.count++;
    beep('ok'); paintCard(); paintGuide(); drawOverlay(); render();
  }
});
window.addEventListener('resize', () => { if (S.live) drawOverlay(); });
$('#backupBtn').addEventListener('click', backup);
$('#restoreBtn').addEventListener('click', () => $('#restoreIn').click());
$('#restoreIn').addEventListener('change', e => { const f = e.target.files[0]; if (f) restore(f); e.target.value = ''; });
let installEvt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; $('#installBtn').hidden = false; });
window.addEventListener('appinstalled', () => { $('#installBtn').hidden = true; installEvt = null; });
$('#installBtn').addEventListener('click', async () => {
  if (!installEvt) return;
  installEvt.prompt();
  try { await installEvt.userChoice; } catch (e) { }
  installEvt = null; $('#installBtn').hidden = true;
});
$('#xlsIn').addEventListener('change', e => { const f = e.target.files[0]; if (f) importKeys(f); e.target.value = ''; });
// drag & drop and paste anywhere on the page
let dragDepth = 0;
document.addEventListener('dragenter', e => { if (e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files')) { dragDepth++; const d = $('#drop'); if (d) d.classList.add('over'); } });
document.addEventListener('dragleave', () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) { const d = $('#drop'); if (d) d.classList.remove('over'); } });
document.addEventListener('dragover', e => { if (e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files')) e.preventDefault(); });
document.addEventListener('drop', e => {
  if (!e.dataTransfer || !e.dataTransfer.files.length) return;
  e.preventDefault(); dragDepth = 0;
  const d = $('#drop'); if (d) d.classList.remove('over');
  const files = Array.from(e.dataTransfer.files);
  const xls = files.find(f => /\.(xlsx|xls|csv)$/i.test(f.name));
  if (xls && S.tab === 'keys') importKeys(xls); else handleFiles(files);
});
document.addEventListener('paste', e => {
  if (e.target.closest && e.target.closest('input')) return;
  const files = Array.from((e.clipboardData && e.clipboardData.files) || []);
  if (files.length) { e.preventDefault(); handleFiles(files); }
});
// review panel
$('#rvClose').addEventListener('click', closeReview);
$('#rvPrev').addEventListener('click', () => stepReview(-1));
$('#rvNext').addEventListener('click', () => stepReview(1));
$('#rvZoom').addEventListener('click', () => { S.zoom = !S.zoom; renderReview(); });
$('#rvCanvas').addEventListener('click', e => { const c = e.target.closest('circle.b'); if (c) toggleBubble(+c.dataset.b); });
$('#rvSide').addEventListener('click', e => {
  const f = e.target.closest('[data-flag]');
  if (f && f.dataset.flag) {
    const rect = document.getElementById('fl-' + f.dataset.flag);
    if (rect) { rect.scrollIntoView({ block: 'center', inline: 'center', behavior: 'smooth' }); rect.classList.remove('hot'); void rect.getBBox(); rect.classList.add('hot'); }
  }
  if (e.target.closest('#rvMark')) {
    const ex = curExam(), r = resultsOf(ex.id).find(x => x.id === S.reviewId);
    if (!r) return;
    r.reviewed = !r.reviewed; markDirty('res', ex.id);
    if (r.reviewed) {
      const list = reviewList(), idx = list.findIndex(x => x.r.id === r.id);
      const nxt = list.slice(idx + 1).find(x => x.d.status === 'check');
      if (nxt) { S.reviewId = nxt.r.id; }
    }
    renderReview();
  }
});
$('#rvSide').addEventListener('change', e => {
  if (e.target.id !== 'rvKey') return;
  const ex = curExam(), r = resultsOf(ex.id).find(x => x.id === S.reviewId);
  if (!r) return;
  r.keyCode = e.target.value || null;
  markDirty('res', ex.id); renderReview();
});
document.addEventListener('keydown', e => {
  if (S.live && !$('#live').hidden && $('#modal').hidden && e.key === 'Escape') { closeLive(); return; }
  if ($('#review').hidden || !$('#modal').hidden) return;
  if (e.key === 'Escape') closeReview();
  if (e.target.closest && e.target.closest('select,input')) return;
  if (e.key === 'ArrowLeft') stepReview(-1);
  if (e.key === 'ArrowRight') stepReview(1);
});

// ---------------------------------------------------------------- boot
applyStatic();
S.exams = [];
newExam(t('examDefault', { n: 1 }), false);
S.examId = S.exams[0].id;
render();
loadState().then(() => { applyStatic(); render(); }).catch(() => { paintSave(); });
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => { }); });
}
})();
</script>
</body>
</html>
